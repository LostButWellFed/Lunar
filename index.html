<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lunar · Lost, But Well Fed</title>
<meta name="description" content="A lunar lander game from Lost, But Well Fed. Land softly next to the street food. Every good landing refuels you. Run out and you're lost.">
<meta name="theme-color" content="#050507">
<meta property="og:title" content="Lunar · Lost, But Well Fed">
<meta property="og:description" content="Land softly next to the street food. Run out of fuel and you're lost.">
<meta property="og:image" content="title.jpg">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050507; --cream:#f3ede2; --muted:#a8a296; --red:#e3261c; --ok:#9bd17a; --warn:#ffb03a;
    --display:"Fraunces", Georgia, serif; --mono:"Space Mono", ui-monospace, Menlo, monospace; --body:"Work Sans", system-ui, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font-family:var(--body);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  .hidden{display:none!important}

  /* HUD, Atari layout: left block and right block */
  .hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 3px #000}
  .hud table{border-collapse:collapse}
  .hud td{padding:1px 0}
  .hud td:first-child{color:var(--muted);padding-right:12px}
  .hud td:last-child{text-align:right;font-weight:700;min-width:62px}
  .hud .right td:first-child{text-align:left}
  .fuelbar{width:100%;height:4px;background:#2a2a30;border-radius:2px;margin-top:3px;overflow:hidden}
  .fuelbar i{display:block;height:100%;background:var(--cream);transition:background .3s}
  .low{color:var(--warn)}
  .world{position:fixed;left:0;right:0;top:22%;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s}
  .world.on{opacity:1}
  .world .n{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,48px);text-shadow:0 2px 12px #000}
  .world .s{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .sound{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);padding:8px;z-index:5}
  body.touch .sound{top:calc(78px + env(safe-area-inset-top));bottom:auto}

  /* Touch controls */
  .pad{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:12px;z-index:4}
  .pad.l{left:14px}.pad.r{right:14px}
  .ctl{width:74px;height:74px;border-radius:50%;background:rgba(243,237,226,.10);border:1.5px solid rgba(243,237,226,.35);font-size:26px;display:flex;align-items:center;justify-content:center;touch-action:none}
  .ctl.big{width:104px;height:104px;background:rgba(227,38,28,.85);border-color:transparent;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.1em}
  .ctl.on{background:rgba(243,237,226,.28)}
  .ctl.big.on{background:#ff4a3a}
  body:not(.touch) .pad{display:none}
  .keys{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;pointer-events:none}
  body.touch .keys{display:none}

  /* Screens */
  .screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  #title{background:#000 url(title.jpg) center 38%/cover no-repeat;flex-direction:column;justify-content:flex-end;padding-bottom:calc(36px + env(safe-area-inset-bottom))}
  #title::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,5,7,.55) 0%,rgba(5,5,7,0) 30%,rgba(5,5,7,.2) 55%,rgba(5,5,7,.95) 82%)}
  #title > *{position:relative}
  .tw{width:min(84vw,460px);height:auto;display:block}
  .tname{font-family:var(--display);font-weight:800;font-size:clamp(46px,11vw,82px);letter-spacing:.14em;margin:6px 0 2px;line-height:1}
  .tsub{color:var(--cream);opacity:.85;font-size:15px;max-width:30ch;text-align:center;line-height:1.45;margin:10px 0 22px}
  .btn{display:block;min-width:220px;padding:16px 22px;border-radius:14px;font-weight:600;font-size:16px;text-align:center;text-decoration:none}
  .btn-red{background:var(--red);color:#fff}
  .btn-ghost{border:1.5px solid rgba(243,237,226,.3);color:var(--cream);margin-top:10px}
  .best{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:16px;letter-spacing:.08em}

  .card{background:rgba(10,10,14,.92);border:1px solid #2c2c33;border-radius:18px;padding:22px 20px 20px;width:min(92vw,420px);box-shadow:0 20px 60px rgba(0,0,0,.6);backdrop-filter:blur(6px)}
  .card .k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700}
  .card .k.good{color:var(--ok)}
  .card h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,6.5vw,34px);margin:6px 0 10px;line-height:1.1}
  .card p.line{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.45;margin:0 0 16px}
  .card .stats{display:flex;gap:10px;margin:0 0 18px;flex-wrap:wrap}
  .card .stat{flex:1;min-width:90px;background:#16161b;border-radius:10px;padding:10px 12px}
  .card .stat b{display:block;font-family:var(--mono);font-size:18px}
  .card .stat span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .card .btn{width:100%}
  .card .hint{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;margin-top:10px;letter-spacing:.08em}
  body.touch .card .hint{display:none}
  .toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--cream);color:#111;padding:12px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
  .toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud hidden" id="hud">
  <table class="left">
    <tr><td>Score</td><td id="hScore">0000</td></tr>
    <tr><td>Time</td><td id="hTime">0:00</td></tr>
    <tr><td>Fuel</td><td id="hFuel">1000</td></tr>
    <tr><td colspan="2"><div class="fuelbar"><i id="hFuelBar"></i></div></td></tr>
  </table>
  <table class="right">
    <tr><td>Altitude</td><td id="hAlt">0</td></tr>
    <tr><td>Horizontal</td><td id="hVx">0</td></tr>
    <tr><td>Vertical</td><td id="hVy">0</td></tr>
    <tr><td>Meals</td><td id="hMeals">0</td></tr>
  </table>
</div>
<div class="world" id="worldBanner"><div class="n" id="wName"></div><div class="s" id="wSub"></div></div>

<div class="pad l hidden" id="padL">
  <button class="ctl" id="bLeft" aria-label="Rotate left">&#8634;</button>
  <button class="ctl" id="bRight" aria-label="Rotate right">&#8635;</button>
</div>
<div class="pad r hidden" id="padR">
  <button class="ctl big" id="bThrust" aria-label="Thrust">THRUST</button>
</div>
<div class="keys hidden" id="keys">&larr; &rarr; rotate &nbsp;·&nbsp; &uarr; or Space thrust &nbsp;·&nbsp; M sound</div>
<button class="sound hidden" id="soundBtn">SOUND ON</button>

<!-- Title -->
<section class="screen" id="title">
  <img class="tw" src="wordmark.png" alt="Lost, But Well Fed">
  <div class="tname">LUNAR</div>
  <p class="tsub">Land softly next to the food. Every good landing refuels you. Run out and you're lost.</p>
  <button class="btn btn-red" id="startBtn">Launch</button>
  <div class="best" id="bestTitle"></div>
</section>

<!-- Result card (landing, crash, game over) -->
<section class="screen hidden" id="result">
  <div class="card">
    <div class="k" id="rKicker">Landed</div>
    <h2 id="rTitle"></h2>
    <p class="line" id="rLine"></p>
    <div class="stats" id="rStats"></div>
    <button class="btn btn-red" id="rNext">Next landing</button>
    <button class="btn btn-ghost hidden" id="rShare">Share my run</button>
    <a class="btn btn-ghost hidden" id="rArrivals" target="_blank" rel="noopener">Play Department of Arrivals</a>
    <a class="btn btn-ghost hidden" id="rEssays" target="_blank" rel="noopener">Read Lost, But Well Fed</a>
    <div class="hint">Space or Enter to continue</div>
  </div>
</section>
<div class="toast" id="toast"></div>

<script src="game.js"></script>
</body>
</html>
